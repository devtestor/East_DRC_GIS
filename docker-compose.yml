services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: edrc-landgis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edrc_land_gis}
      POSTGRES_USER: ${POSTGRES_USER:-edrc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edrc_app} -d ${POSTGRES_DB:-edrc_land_gis}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
