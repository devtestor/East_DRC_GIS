spring:
  application:
    name: edrc-land-gis-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edrc_land_gis}
    username: ${DB_USER:edrc_app}
    password: ${DB_PASSWORD:change-me-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${API_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  tomcat:
    max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:16KB}

edrc:
  public-mode-disclaimer: "This platform is a proposed land-information and workflow system, not an official land registry."
  audit:
    trusted-proxy-cidrs: ${AUDIT_TRUSTED_PROXY_CIDRS:}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:false}
    staff-email: ${DEV_SEED_STAFF_EMAIL:phase2.staff@example.test}
    staff-password: ${DEV_SEED_STAFF_PASSWORD:ChangeMe-Phase2-Local!}
