global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: edrc-land-gis-api
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - edrc-land-gis-api:8080
        labels:
          service: edrc-land-gis-api
          environment: staging
