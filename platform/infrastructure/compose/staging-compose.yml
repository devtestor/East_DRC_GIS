services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: edrc_land_gis
      POSTGRES_USER: edrc_app
      POSTGRES_PASSWORD: change-me-staging-smoke-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edrc_app -d edrc_land_gis"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: edrc-land-gis-api:staging-smoke
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: edrc_land_gis
      DB_USER: edrc_app
      DB_PASSWORD: change-me-staging-smoke-only
      DEV_SEED_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: "https://staff.staging.example,https://citizen.staging.example"
    ports:
      - "8080:8080"
