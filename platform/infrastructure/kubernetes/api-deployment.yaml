apiVersion: apps/v1
kind: Deployment
metadata:
  name: edrc-land-gis-api
  namespace: edrc-land-gis
  labels:
    app.kubernetes.io/name: edrc-land-gis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edrc-land-gis-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edrc-land-gis-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/devtestor/east_drc_gis/edrc-land-gis-api:replace-with-approved-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEV_SEED_ENABLED
              value: "false"
            - name: API_PORT
              value: "8080"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: edrc-land-gis-api-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: edrc-land-gis-api-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: edrc-land-gis-api-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: edrc-land-gis-api-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edrc-land-gis-api-secrets
                  key: DB_PASSWORD
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: edrc-land-gis-api-config
                  key: CORS_ALLOWED_ORIGINS
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
